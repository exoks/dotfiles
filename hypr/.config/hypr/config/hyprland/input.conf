# ===[ Input: config ]=========================================================
# HINT:> https://wiki.hyprland.org/Configuring/Variables/#input

input {
    kb_layout = us,ara
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    kb_options = grp:win_space_toggle
    # touchpad {
    #     natural_scroll = false 
    # }
}

# Cursor Config 
cursor {
    inactive_timeout = 20 
    hide_on_key_press = false # default false 
    hide_on_touch = false # default: true
}

# HINT:> https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# HINT:
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
