# ===[ kitty: config ]=========================================================
# INFO:[ pywal_colors: ]>========================
include ~/.cache/wal/colors-kitty.conf

# INFO:[ colorscheme: ]>=========================
# include tokyo-night-theme.conf

# INFO:[ font: ]>================================
font_family FiraCode Nerd Font Mono
# font_family Hack Nerd Font Mono
font_size 12
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

# Disable the audible bell.
enable_audio_bell no
# Allow local scripts to update Kitty colors and other settings.
allow_remote_control yes

# INFO:[ padding: ]>=============================
padding 100

# INFO:[ transperancy & blur: ]>=================
background_opacity 0.70
# NOTE:[ kitty blur is ignored, blur must be controled by hyrpland]
# background_blur 90

# INFO:[ window_demention: ]>====================
# top  / right / bottom / left 
window_padding_width 3 3 0 3  
# window_margin_width 10

# Run tmux Immdiatly
shell tmux
